[project]
name = "atc_flow"
version = "0.1.0"
description = "Air Traffic Control conflict detection and resolution multi-agent system (CrewAI) - MAS, ETSE-URV 2026-27, Team 11"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Same version used in the course labs (Lab/requirements.txt). Do not upgrade without
    # agreeing it with the team: CrewAI changes its API between releases.
    "crewai[tools]==1.15.22",
    "networkx>=3.2",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.15",
]

[project.scripts]
kickoff = "atc_flow.main:kickoff"
run_crew = "atc_flow.main:kickoff"
plot = "atc_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atc_flow"]

[tool.crewai]
type = "flow"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: needs a running LLM (Ollama or API). Skipped in CI; run with `pytest -m llm`.",
]
addopts = "-m 'not llm'"
